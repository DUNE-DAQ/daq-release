name: Build nightly release

permissions:
  contents: read

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      tag-prefix:
        description: 'nightly tag prefix (also used for output container tag)'
        default: ''
      feature-branch:
        description: 'feature branch to be used across all DAQ repos wherever possible.'
        default: develop
      cvmfs-deployment:
        description: 'whether to deploy the release to cvmfs'
        default: 'no'
      send-slack-message:
        description: 'whether to send a message to #daq-release-notifications on completion'
        default: 'no'

jobs:
  make_tags:
    name: create core tag and target tag
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.create_tags.outputs.platforms }}
    defaults:
      run:
        shell: bash
    steps:
    - id: create_tags
      run: |
        date_tag=$(date +%y%m%d)

        # Use GitHub input if provided, else default to N
        prefix="${{ inputs.tag-prefix || 'N' }}"

        # Construct a JSON blob containing all necessary information
        # for building on separate operating systems
        ### TODO: Update al10 image when available ###
        jq -c -n --arg prefix "$prefix" --arg date "$date_tag" '
          [
            { label: "al9",  suffix: "A9",  os: "almalinux9",
              input_image: "ghcr.io/dune-daq/alma9-slim-externals:v2.3",
              output_image: "ghcr.io/dune-daq/nightly-release-alma9",
            },
            { label: "al10", suffix: "A10", os: "almalinux10",
              input_image: "ghcr.io/dune-daq/alma9-slim-externals:v2.3T",
              output_image: "ghcr.io/dune-daq/nightly-release-alma9T",
            }
          ]
          | map(. + {
              core_tag:   ($prefix + "B_DEV_"  + $date + "_" + .suffix),
              target_tag: ($prefix + "FD_DEV_" + $date + "_" + .suffix)
            })
        ' | tee platforms.json >> /dev/null

        echo "platforms=$(cat platforms.json)" >> "$GITHUB_OUTPUT"
        jq . platforms.json   # pretty-print into the log for debugging
    
    - uses: cvmfs-contrib/github-action-cvmfs@d79d292a9fc4a1d34fe5caa390308d0ec4ffe993
      with:
        cvmfs_repositories: 'dunedaq-development.opensciencegrid.org'
    - name: Check tag on cvmfs
      run: |
        for tag in $(jq -r '.[].target_tag' platforms.json); do
          if [[ -d /cvmfs/dunedaq-development.opensciencegrid.org/nightly/$tag ]]; then
            echo "ERROR: Build area $tag already exists on CVMFS."; exit 1
          fi
        done


  build_release:
    name: build_release (${{ matrix.label }})
    runs-on: daq
    needs: make_tags
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.make_tags.outputs.platforms) }}
    container:
      image: ${{ matrix.input_image }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout daq-release
      uses: actions/checkout@v6
      with:
        path: daq-release
    
    - name: Set environment variables
      run: |
        echo "CORE_RELEASE_DIR=/cvmfs/dunedaq-development.opensciencegrid.org/nightly/${{ matrix.core_tag }}" >> $GITHUB_ENV
        echo "TARGET_RELEASE_DIR=/cvmfs/dunedaq-development.opensciencegrid.org/nightly/${{ matrix.target_tag }}" >> $GITHUB_ENV
        echo "OS=${{ matrix.os }}" >> $GITHUB_ENV

    - name: setup directories and install spack for the coredaq release
      run: |
        source daq-release/scripts/spack/release-setup-tools.sh
        input_feature_branch=${{ inputs.feature-branch }}
        # For automatically triggered workflows where feature-branch is not set, fall back to default branch
        branch=${input_feature_branch:-"develop"}

        daq-release/scripts/checkout-daq-package.py -i daq-release/configs/coredaq/fddaq-develop/release.yaml -a -o $TARGET_RELEASE_DIR/sourcecode -b $branch --continue-on-error || [[ "$branch" != "develop" ]]
        daq-release/scripts/spack/build-release.sh $CORE_RELEASE_DIR $TARGET_RELEASE_DIR coredaq $OS ${{ inputs.feature-branch }}

        cd $CORE_RELEASE_DIR/../
        tar_and_stage_release ${CORE_RELEASE_TAG}

    - name: upload spack nightly tarball for base release
      uses: actions/upload-artifact@v7
      with:
        name: nightly_coredaq_${{ matrix.os }}
        path: ${{ github.workspace }}/tarballs_for_upload/${{matrix.core_tag}}.tar.gz

    - name: setup directories and install spack for the fddaq release
      run: |
        source daq-release/scripts/spack/release-setup-tools.sh
        input_feature_branch=${{ inputs.feature-branch }}
        # For automatically triggered workflows where feature-branch is not set, fall back to default branch
        branch=${input_feature_branch:-"develop"}

        daq-release/scripts/checkout-daq-package.py -i daq-release/configs/fddaq/fddaq-develop/release.yaml -a -o $TARGET_RELEASE_DIR/sourcecode -b $branch --continue-on-error || [[ "$branch" != "develop" ]]
        daq-release/scripts/checkout-daq-package.py -i daq-release/configs/fddaq/fddaq-develop/release.yaml -a -o $TARGET_RELEASE_DIR/sourcecode -b $branch --pymodules --continue-on-error || [[ "$branch" != "develop" ]]
        daq-release/scripts/spack/build-release.sh $CORE_RELEASE_DIR $TARGET_RELEASE_DIR fddaq $OS ${{ inputs.feature-branch }}

        cd $TARGET_RELEASE_DIR/../
        tar_and_stage_release ${TARGET_RELEASE_TAG}

    - name: upload spack nightly tarball for far detector release
      uses: actions/upload-artifact@v7
      with:
        name: nightly_fddaq_${{ matrix.os }}
        path: ${{ github.workspace }}/tarballs_for_upload/${{matrix.target_tag}}.tar.gz

  update_image:
    name: update_spack_image_nightly
    runs-on: daq
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.make_tags.outputs.platforms) }}
    needs: [make_tags, build_release] 
    env:
      TAG: ${{ inputs.tag-prefix }}
    environment: dockerhub
    permissions:
      packages: write
      contents: read

    steps:
      - name: clean docker-build
        run: |
            mkdir -p ${GITHUB_WORKSPACE}/docker-build 
            rm -rf ${GITHUB_WORKSPACE}/docker-build/*

      - name: Download spack nightly release tarball artifact for base release
        uses: actions/download-artifact@v8
        with:
          name: nightly_coredaq_${{ matrix.os }}
          path: ${{ github.workspace }}/docker-build

      - name: Download nightly release tarball artifact for far detector release
        uses: actions/download-artifact@v8
        with:
          name: nightly_fddaq_${{ matrix.os }}
          path: ${{ github.workspace }}/docker-build

      - name: prepare cvmfs mirror spack-nightly
        run: |
            cd ${{ github.workspace }}/docker-build
            mkdir -p nightly

            cd nightly
            tar xf ../${{ matrix.core_tag }}.tar.gz
            rm -rf ../${{ matrix.core_tag}}.tar.gz

            tar xf ../${{ matrix.target_tag}}.tar.gz
            rm -rf ../${{ matrix.target_tag}}.tar.gz

            if [[ "${{ matrix.target_tag }}" == NFD_*_A9 ]]; then
              ln -s ${{ matrix.target_tag }} last_fddaq
            elif [[ "${{ matrix.target_tag }}" == NFD_*_A10 ]]; then
              ln -s ${{ matrix.target_tag }} last_fddaq_a10
            fi

            cd ..
            echo "FROM "${{ matrix.input_image }} > Dockerfile
            echo 'MAINTAINER John Freeman "jcfree@fnal.gov"' >> Dockerfile
            echo "ENV REFRESHED_AT ${{ matrix.core_tag }}" >> Dockerfile
            echo "COPY --from=ghcr.io/dune-daq/pypi-repo:latest /cvmfs/dunedaq.opensciencegrid.org/pypi-repo /cvmfs/dunedaq.opensciencegrid.org/pypi-repo" >> Dockerfile
            echo "ADD nightly /cvmfs/dunedaq-development.opensciencegrid.org/nightly" >> Dockerfile
            echo 'ENTRYPOINT ["/bin/bash"]' >> Dockerfile

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ matrix.output_image }}
          tags: |
            type=raw,value=development_v5${{ inputs.tag-prefix }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/docker-build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  generate_dbt_setup_release_env:
    name: generate_dbt_setup_release_env
    runs-on: daq
    needs: [make_tags, update_image]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.make_tags.outputs.platforms) }}
    container:
      image: ${{ matrix.output_image }}:development_v5${{ inputs.tag-prefix }}
    env:
      DET: 'fd'
    defaults:
      run:
        shell: bash

    steps:
    
    - name: create dbt-setup-release-env.sh and daq_app_rte.sh for fddaq
      run: |
          source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
          setup_dbt latest_v5
          dbt-setup-release -n ${{ matrix.target_tag }}
          declare -x > ${GITHUB_WORKSPACE}/${DET}daq-dbt-setup-release-env.sh
          declare -f >> ${GITHUB_WORKSPACE}/${DET}daq-dbt-setup-release-env.sh
          egrep "declare -x (PATH|.*_SHARE|CET_PLUGIN_PATH|DUNEDAQ_SHARE_PATH|LD_LIBRARY_PATH|LIBRARY_PATH|PYTHONPATH)=" ${GITHUB_WORKSPACE}/${DET}daq-dbt-setup-release-env.sh > ${GITHUB_WORKSPACE}/${DET}daq_app_rte.sh

    - name: upload fddaq-dbt-setup-release-env.sh
      uses: actions/upload-artifact@v7
      with:
        name: fddaq-dbt_setup_release_env_${{ matrix.os }}
        path: ${{ github.workspace }}/fddaq-dbt-setup-release-env.sh

    - name: upload fddaq_app_rte.sh
      uses: actions/upload-artifact@v7
      with:
        name: fddaq_app_rte_${{ matrix.os }}
        path: ${{ github.workspace }}/fddaq_app_rte.sh

  publish_to_cvmfs:
    name: publish to cvmfs
    if: ${{ inputs.cvmfs-deployment == 'yes' }}
    strategy:
      fail-fast: false
      # max-parallel is currently a no-op, but could be relevant if we parallelize builds 
      # in the future
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.make_tags.outputs.platforms) }}
    needs: [make_tags, generate_dbt_setup_release_env]
    runs-on: daq

    steps:
    - name: download fddaq-dbt-setup-release-env.sh
      uses: actions/download-artifact@v8
      with:
        name: fddaq-dbt_setup_release_env_${{ matrix.os }}
        path: ${{ github.workspace }}/fddaq-release

    - name: download fddaq_app_rte.sh
      uses: actions/download-artifact@v8
      with:
        name: fddaq_app_rte_${{ matrix.os }}
        path: ${{ github.workspace }}/fddaq-rte

    - name: start docker container, and then rsync... 
      env:
        IMAGE: "${{ matrix.output_image }}:development_v5${{ inputs.tag-prefix }}"
      run: |
        cd $GITHUB_WORKSPACE

        unique_name=$( date | tr " :" _ )

        docker pull $IMAGE
        files_to_copy=$( docker run --rm --entrypoint ls $IMAGE /cvmfs/dunedaq-development.opensciencegrid.org/nightly )

        docker run --name $unique_name $IMAGE
        mkdir $unique_name

        for file in $files_to_copy; do
             docker cp $unique_name:/cvmfs/dunedaq-development.opensciencegrid.org/nightly/$file $unique_name
        done
        docker rm $unique_name
        docker system prune -f

        #dir_for_env_scripts=$( find $unique_name -mindepth 1 -maxdepth 1 -type d -name "NFD*" )
        dir_for_env_scripts="$unique_name/${{ matrix.target_tag }}"
        cp ./fddaq-release/fddaq-dbt-setup-release-env.sh     $dir_for_env_scripts/dbt-setup-release-env.sh
        cp ./fddaq-rte/fddaq_app_rte.sh                       $dir_for_env_scripts/daq_app_rte.sh

        kinit  -k -t $HOME/daq-nightly.keytab nightly-build/dune/daq.dunescience.org@FNAL.GOV

        ssh -o StrictHostKeyChecking=no -l cvmfsdunedaqdev oasiscfs05.fnal.gov "cvmfs_server transaction dunedaq-development.opensciencegrid.org"

        rsync -e "ssh -o StrictHostKeyChecking=no" -rlpt --stats $unique_name/* cvmfsdunedaqdev@oasiscfs05.fnal.gov:/cvmfs/dunedaq-development.opensciencegrid.org/nightly

        ssh -o StrictHostKeyChecking=no -l cvmfsdunedaqdev oasiscfs05.fnal.gov "cvmfs_server publish dunedaq-development.opensciencegrid.org"

        rm -rf $unique_name

  send_slack_message:
    if: (github.event_name != 'workflow_dispatch' && failure()) || (github.event_name == 'workflow_dispatch' && inputs.send-slack-message == 'yes')
    needs: [make_tags, publish_to_cvmfs]
    uses: ./.github/workflows/slack-notification.yml
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.make_tags.outputs.platforms) }}
    with:
      release_tag: ${{ matrix.target_tag }}
    secrets: 
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  poll_cvmfs_for_release:
    needs: [make_tags, publish_to_cvmfs]
    uses: ./.github/workflows/poll-cvmfs-for-release.yml
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.make_tags.outputs.platforms) }}
    with:
      release-tag: ${{ matrix.target_tag }}
      send-slack-message: 'yes'
    secrets: inherit

  cleanup_tarballs:
    name: cleanup tarballs from runner
    runs-on: daq
    if: always()
    needs: publish_to_cvmfs
    steps:
    - name: cleanup tarballs from daq.fnal.gov
      run: |
        files_older_than_30_days=$(find "${{ github.workspace }}/tarballs_for_upload" -name "*.tar.gz" -mtime +30 -print)
        echo "Found the following files older than 30 days:"
        echo "$files_older_than_30_days"
        if [[ -n "$files_older_than_30_days" ]]; then
          echo "Removing $files_older_than_30_days"
          rm -f "$files_older_than_30_days"
        fi

