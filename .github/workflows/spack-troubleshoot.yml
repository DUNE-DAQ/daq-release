name: Alma10 Spack Troubleshooting

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  troubleshoot_spack:
    name: troubleshoot_spack
    runs-on: daq
    container:
      image: ghcr.io/dune-daq/alma10-slim-externals:v2.3
    defaults:
      run:
        shell: bash

    steps:
    - name: basic_check
      run: |
        source /cvmfs/dunedaq.opensciencegrid.org/spack/externals/ext-v2.3/spack-0.22.0/share/spack/setup-env.sh
        spack clean -a
        echo "PYTHONPATH == $PYTHONPATH"
        echo "PATH == $PATH"
        ls -l /github/home/.spack/bootstrap
        spack -dv --stacktrace spec graphviz
        echo "JCF: done"
