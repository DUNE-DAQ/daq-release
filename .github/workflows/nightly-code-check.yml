name: Nightly code check workflow

on:
  workflow_dispatch:
    inputs:
      send-slack-message:
        description: 'whether to send a message to #daq-release-notifications on completion'
        default: 'no'
  schedule:
    - cron: "30 8 * * *"

jobs:
  make_variables:
    name: create nightly tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create_nightly_tag.outputs.nightly_tag }} 
    defaults:
      run:
        shell: bash
    steps:
      - id: create_nightly_tag
        run: |
          date_tag=$(date +%y%m%d)
          echo "nightly_tag=NFD_DEV_${date_tag}_A9"  >>  "$GITHUB_OUTPUT"
  
  start_snapshot:
    needs: make_variables
    name: starting snapshot
    runs-on: daq
    defaults:
      run:
        shell: bash
    steps:
      - id: starting_snapshot
        run: |
          ./take_snapshot.sh | tee starting_snapshot_code_check.txt

  start_resource_monitor:
    name: resource monitor
    needs: start_snapshot
    runs-on: daq
    defaults:
      run:
        shell: bash
    outputs:
      RESOURCE_MONITOR_PID: ${{ steps.start_monitor.outputs.MONITOR_PID }}
    steps:
    - id: start_monitor
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/metrics"
        (
          while true; do
            ts=$(date -Is)
            {
              echo "---- $ts ----"
              echo "[load] $(cut -d' ' -f1-3 /proc/loadavg 2>/dev/null || true)"
              echo "[mem]"
              free -h || true
              echo "[disk]"
              df -h "$GITHUB_WORKSPACE" || true
              echo "[top]"
              ps -eo pid,ppid,cmd,%cpu,%mem,rss --sort=-%cpu | head -n 15 || true
              echo
            } >> "$GITHUB_WORKSPACE/metrics/nightly_code_check_resource.log"
            sleep 10
          done
        ) &
        echo "MONITOR_PID=$!" >> "$GITHUB_OUTPUT"
        
  run_unittests:
    needs: [start_snapshot, make_variables]
    uses: ./.github/workflows/unit-tests.yml
    with:
      release_tag: ${{ needs.make_variables.outputs.tag }}
      upload_logs: 'yes'

  run_checks:
    name: Run integration tests and clang formatting
    runs-on: daq
    needs: [make_variables, run_unittests]
    timeout-minutes: 60
    env:
      DBT_AREA_ROOT: ${{ needs.make_variables.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout daq-release
      uses: actions/checkout@v6
      with:
        path: daq-release-code-checks
    - name: Create build area
      run: |
        source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
        setup_dbt latest_v5
        dbt-create -n ${{ env.DBT_AREA_ROOT }}
        cd ${{ env.DBT_AREA_ROOT }}
        source env.sh
        cd ../daq-release-code-checks/scripts
        #cd ${{ github.workspace }}/daq-release-code-checks/scripts
        ./checkout-daq-package.py -i ../configs/coredaq/coredaq-develop/release.yaml -a -o ${DBT_AREA_ROOT}/sourcecode
        ./checkout-daq-package.py -i ../configs/fddaq/fddaq-develop/release.yaml -a -o ${DBT_AREA_ROOT}/sourcecode
        #./checkout-daq-package.py -p hdf5libs -b develop -i ../configs/coredaq/coredaq-develop/release.yaml -o ${DBT_AREA_ROOT}/sourcecode
        #./checkout-daq-package.py -p trigger -b develop -i ../configs/coredaq/coredaq-develop/release.yaml -o ${DBT_AREA_ROOT}/sourcecode
        echo "DBT_AREA_ROOT=$DBT_AREA_ROOT" >> "$GITHUB_ENV"
    - name: Run clang formatting
      run: |
        cd ${{ env.DBT_AREA_ROOT }}
        source env.sh
        cd sourcecode
        dbt-clang-format.sh . --view-differences-only --markdown-summary
        cat clang_format_summary_table.md >> $GITHUB_STEP_SUMMARY
    - name: Upload clang formatting summary
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: clang_formatting_summary
        path: ${{ env.DBT_AREA_ROOT }}/sourcecode/clang_format_summary_table.md

  send_slack_message:
    if: (github.event_name != 'workflow_dispatch' && failure()) || (github.event_name == 'workflow_dispatch' && github.event.inputs.send-slack-message == 'yes')
    needs: [make_variables, run_checks]
    uses: ./.github/workflows/slack-notification.yml
    secrets: 
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
    with:
      release_tag: ${{ needs.make_variables.outputs.tag }}

  end_snapshot:
    needs: run_checks
    name: ending snapshot
    runs-on: daq
    defaults:
      run:
        shell: bash
    steps:
      - id: ending_snapshot
        run: |
          ./take_snapshot.sh | tee ending_snapshot_code_check.txt

  stop_resource_monitor:
    name: stop resource monitor
    needs: [start_resource_monitor, end_snapshot]
    if: always()
    runs-on: daq
    defaults:
      run:
        shell: bash
    env:
      RESOURCE_MONITOR_PID: ${{ needs.start_resource_monitor.outputs.RESOURCE_MONITOR_PID }}
    steps:
    - id: start_monitor
      run: |
        if [[ -n "$RESOURCE_MONITOR_PID:-" ]]; then
          kill "$RESOURCE_MONITOR_PID" || true
        fi

  cleanup_test_area:
    runs-on: daq
    if: always()
    needs: [make_variables, send_slack_message]
    steps:
      - name: Remove test directory and daq-release
        run: |
          rm -rf daq-release-code-checks
          rm -rf ${{ needs.make_variables.outputs.tag }}