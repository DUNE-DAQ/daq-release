name: Alma10 build v5 nightly release with externals v2.3

permissions:
  contents: read

on:
#  schedule:
#    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      tag-prefix:
        description: 'nightly tag prefix (also used for output container tag)'
        default: ''
      feature-branch:
        description: 'feature branch to be used across all DAQ repos wherever possible.'
        default: develop
      cvmfs-deployment:
        description: 'whether to deploy the release to cvmfs'
        default: 'no'
      send-slack-message:
        description: 'whether to send a message to #daq-release-notifications on completion'
        default: 'no'

jobs:
  make_tags:
    name: create core tag and target tag
    runs-on: ubuntu-latest
    outputs:
      core_tag: ${{ steps.create_tags.outputs.core_tag }}
      target_tag: ${{ steps.create_tags.outputs.target_tag }}
    defaults:
      run:
        shell: bash
    steps:
    - id: create_tags
      run: |
        date_tag=$(date +%y%m%d)
