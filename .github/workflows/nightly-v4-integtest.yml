name: Nightly v4 integration tests

on:
  schedule:
    - cron: "0 9 * * 0"

  workflow_dispatch:
    inputs:
      send-slack-message:
        description: 'whether to send a message to #daq-release-notifications on completion'
        default: 'no'


jobs:
  make_nightly_tag:
    name: create nightly tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create_nightly_tag.outputs.nightly_tag }} 
    defaults:
      run:
        shell: bash
    steps:
      - id: create_nightly_tag
        run: |
          date_tag=$(date +%y%m%d)
          if [ "$(date +%a)" != "Sun" ]; then 
            date_tag=$(date +%y%m%d -d 'last sunday'); 
          fi
          echo "nightly_tag=NFD_PROD4_${date_tag}_A9"  >>  "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  integration_tests:
    name: integration_tests
    runs-on: daq
    timeout-minutes: 30
    needs: make_nightly_tag
    outputs:
      integtest_xml_path: ${{ steps.setup_and_run_test.outputs.INTEGTEST_OUTPUT_PATH }}
    strategy:
        fail-fast: false
        matrix:
            test_name: ["minimal_system_quick", "fake_data_producer", "long_window_readout", "small_footprint_quick"]
    defaults:
      run:
        shell: bash

    steps:

    - name: Checkout daqsystemtest
      uses: actions/checkout@v4
      with:
        repository: DUNE-DAQ/daqsystemtest
        path: daqsystemtest
        ref: production/v4
    
    - name: setup release and run tests
      id: setup_and_run_test
      env:
        NIGHTLY_TAG: ${{needs.make_nightly_tag.outputs.tag}}
      run: |
          DET=fd
          INTEGTEST_OUTPUT_PATH=$GITHUB_WORKSPACE/integration_tests_$NIGHTLY_TAG
          mkdir -p $INTEGTEST_OUTPUT_PATH
          cd $INTEGTEST_OUTPUT_PATH
          export PATH=$HOME/bin:$PATH
          type get-ticket.sh && get-ticket.sh
          source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
          setup_dbt latest_v4
          dbt-setup-release -n $NIGHTLY_TAG
          pytest -v -s --junit-xml=${{ matrix.test_name }}_test_results.xml \
                 $GITHUB_WORKSPACE/daqsystemtest/integtest/${{ matrix.test_name }}_test.py \
                 --nanorc-option partition-number 4
          echo "INTEGTEST_OUTPUT_PATH=$INTEGTEST_OUTPUT_PATH" >> "$GITHUB_OUTPUT"
          cd $GITHUB_WORKSPACE
          rm -rf daqsystemtest

  parse_results:
    runs-on: daq
    if: always()
    needs: [make_nightly_tag, integration_tests]
    steps:
    - name: Checkout daq-release
      uses: actions/checkout@v4
      with:
        repository: DUNE-DAQ/daq-release
        path: daq-release-integtest
    - name: Generate summary tables
      env:
        NIGHTLY_TAG: ${{ needs.make_nightly_tag.outputs.tag}}
      run: |
        cd daq-release-integtest/scripts/github-ci/
        python integtest_xml_parser.py --input-directory ${{ github.workspace }}/integration_tests_${{ env.NIGHTLY_TAG }}
        cat pytest_summary_table.md >> $GITHUB_STEP_SUMMARY

  store_and_upload_logs:
    runs-on: daq
    timeout-minutes: 5
    needs: [make_nightly_tag, integration_tests]
    if: success() || failure()
    outputs:
      integtest_log_path: ${{ steps.copy_logs.outputs.PERSISTENT_LOG_DIR }}
    steps:
    - name: Copy logs to persistent directory on daq.fnal.gov
      id: copy_logs
      run: |
        TIMESTAMP=$(date +"%Y-%m-%d-%H%M%Z")
        PERSISTENT_LOG_DIR=/home/nfs/dunedaq/github-actions/pytest-logs-${TIMESTAMP}
        echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
        echo "PERSISTENT_LOG_DIR=$PERSISTENT_LOG_DIR" >> $GITHUB_ENV
        mkdir -p $PERSISTENT_LOG_DIR
        cp -rL $(readlink -f /tmp/pytest-of-dunedaq/pytest-current/) $PERSISTENT_LOG_DIR
        chmod -R 755 $PERSISTENT_LOG_DIR
        if [[ $(du -sk $PERSISTENT_LOG_DIR | awk '{print $1}') -gt 10000000 ]]; then
          echo "The log directory $PERSISTENT_LOG_DIR has exceeded 10 GB. Deleting and exiting..."
          rm -rf $PERSISTENT_LOG_DIR
          exit 2
        fi
        echo "PERSISTENT_LOG_DIR=$PERSISTENT_LOG_DIR" >> "$GITHUB_OUTPUT"
    - name: Upload logs as artifact
      uses: actions/upload-artifact@v4
      with:
        name: pytest-logs-${{ env.TIMESTAMP }}
        path: ${{ env.PERSISTENT_LOG_DIR }}
    - name: Delete old log directories
      run: |
        old_dirs=$(find /home/nfs/dunedaq/github-actions -mindepth 1 -maxdepth 1 -type d -mtime +7)
        echo "Removing the following directories that are more than 7 days old: $old_dirs"
        rm -rf $old_dirs

  send_slack_message:
    if: (github.event_name != 'workflow_dispatch' && failure()) || (github.event_name == 'workflow_dispatch' && github.event.inputs.send-slack-message == 'yes')
    needs: [integration_tests, store_and_upload_logs]
    uses: ./.github/workflows/slack-notification.yml
    with:
      integtest_xml_dir: ${{ needs.integration_tests.outputs.integtest_xml_path }}
      integtest_log_dir: ${{ needs.store_and_upload_logs.outputs.integtest_log_path }}
    secrets: 
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  cleanup_xml_files:
    runs-on: daq
    if: always()
    needs: [make_nightly_tag, parse_results, send_slack_message]
    steps:
      - name: Remove xml files
        env:
          NIGHTLY_TAG: ${{ needs.make_nightly_tag.outputs.tag }}
        run: |
          rm -rf ${{ github.workspace }}/integration_tests_${{ env.NIGHTLY_TAG }}

  # Integration tests can sometimes collide with stale processes, leading to timeout
  cleanup_stale_gunicorn_processes:
    runs-on: daq
    if: always()
    needs: integration_tests
    steps:
      - name: Run cleanup script
        run: |
          /home/nfs/dunedaq/kill_stale_gunicorn_processes.sh

