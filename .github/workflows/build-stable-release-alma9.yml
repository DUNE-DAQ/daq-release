name: Alma9 build v5 stable release 

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      core-release:
        description: 'core release (e.g. v4.4.0)'
        required: true
      fddaq-release:
        description: 'fddaq release (e.g. v4.3.0)'
        required: true
      build-number:
        description: 'stable release number, e.g. 1'
        required: true

jobs:
  build_the_stable_release_spack:
    name: build_stable_release_spack
    runs-on: daq
    container:
      image: ghcr.io/dune-daq/alma9-slim-externals:v2.3
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout daq-release
      uses: actions/checkout@v6
      with:
        path: daq-release

    - name: setup directories and install spack for the core release
      run: |
          export CORE_RELEASE_DIR=/cvmfs/dunedaq.opensciencegrid.org/spack/releases/coredaq-${{ github.event.inputs.core-release }}-a9-${{ github.event.inputs.build-number }}
          export TARGET_RELEASE_DIR=/cvmfs/dunedaq.opensciencegrid.org/spack/releases/fddaq-${{ github.event.inputs.fddaq-release }}-a9-${{ github.event.inputs.build-number }}
          export OS=almalinux9
          source daq-release/scripts/spack/release-setup-tools.sh

          daq-release/scripts/checkout-daq-package.py -i daq-release/configs/coredaq/fddaq-coredaq-${{ github.event.inputs.core-release }}/release.yaml -a -c -o $TARGET_RELEASE_DIR/sourcecode
          daq-release/scripts/spack/build-release.sh $CORE_RELEASE_DIR $TARGET_RELEASE_DIR coredaq $OS

          cd $CORE_RELEASE_DIR/..
          tar_and_stage_release $CORE_RELEASE_TAG

    - name: upload spack stable release tarball for the core release
      uses: actions/upload-artifact@v7
      with:
        name: stables_coredaq
        path: ${{ github.workspace }}/tarballs_for_upload/coredaq-${{ github.event.inputs.core-release }}-a9-${{ github.event.inputs.build-number }}.tar.gz

    - name: setup directories and install spack for the fddaq release
      run: |
          export CORE_RELEASE_DIR=/cvmfs/dunedaq.opensciencegrid.org/spack/releases/coredaq-${{ github.event.inputs.core-release }}-a9-${{ github.event.inputs.build-number }}
          export TARGET_RELEASE_DIR=/cvmfs/dunedaq.opensciencegrid.org/spack/releases/fddaq-${{ github.event.inputs.fddaq-release }}-a9-${{ github.event.inputs.build-number }}
          export OS=almalinux9
          source daq-release/scripts/spack/release-setup-tools.sh

          daq-release/scripts/checkout-daq-package.py -i daq-release/configs/fddaq/fddaq-${{ github.event.inputs.fddaq-release }}/release.yaml -a -c -o $TARGET_RELEASE_DIR/sourcecode
          daq-release/scripts/checkout-daq-package.py -i daq-release/configs/fddaq/fddaq-${{ github.event.inputs.fddaq-release }}/release.yaml -a -c -o $TARGET_RELEASE_DIR/sourcecode --pymodules --continue-on-error || true  # druncschema's CMakeLists.txt version will confuse checkout-daq-package.py, hence the "|| true"
          daq-release/scripts/spack/build-release.sh $CORE_RELEASE_DIR $TARGET_RELEASE_DIR fddaq $OS

          cd $TARGET_RELEASE_DIR/..
          tar_and_stage_release $TARGET_RELEASE_TAG


    - name: upload spack stable release tarball for the fddaq release
      uses: actions/upload-artifact@v7
      with:
        name: stables_fddaq
        path: ${{ github.workspace }}/tarballs_for_upload/fddaq-${{ github.event.inputs.fddaq-release }}-a9-${{ github.event.inputs.build-number }}.tar.gz

  update_image:
    name: update_spack_image_rc
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - input_image: "ghcr.io/dune-daq/alma9-slim-externals:v2.3"
            output_image: "ghcr.io/dune-daq/stable-release-alma9"
            tag: fddaq-${{ github.event.inputs.fddaq-release }}-a9
    needs: build_the_stable_release_spack
    environment: dockerhub
    permissions:
      packages: write
      contents: read

    steps:
      - name: clean docker-build
        run: |
            mkdir -p ${GITHUB_WORKSPACE}/docker-build 
            rm -rf ${GITHUB_WORKSPACE}/docker-build/*

      - name: Download spack stable release tarball artifact for core release
        uses: actions/download-artifact@v8
        with:
          name: stables_coredaq
          path: ${{ github.workspace }}/docker-build

      - name: Download spack stable release tarball artifact for fddaq release
        uses: actions/download-artifact@v8
        with:
          name: stables_fddaq
          path: ${{ github.workspace }}/docker-build

      - name: prepare cvmfs mirror spack-stables
        run: |
            cd ${{ github.workspace }}/docker-build
            mkdir -p releases

            cd releases
            core_tag=coredaq-${{ github.event.inputs.core-release }}-a9
            tar xf ../${core_tag}-${{ github.event.inputs.build-number }}.tar.gz
            rm -rf ../${core_tag}-${{ github.event.inputs.build-number }}.tar.gz

            tar xf ../${{ matrix.tag }}-${{ github.event.inputs.build-number }}.tar.gz
            rm -rf ../${{ matrix.tag }}-${{ github.event.inputs.build-number }}.tar.gz
            ln -s ${{ matrix.tag }}-${{ github.event.inputs.build-number }} ${{ matrix.tag }}

            cd ..
            echo "FROM "${{ matrix.input_image }} > Dockerfile
            echo 'MAINTAINER John Freeman "jcfree@fnal.gov"' >> Dockerfile
            echo "ENV REFRESHED_FOR "${{ matrix.tag }} >> Dockerfile
            echo "ADD releases /cvmfs/dunedaq.opensciencegrid.org/spack/releases" >> Dockerfile
            echo 'ENTRYPOINT ["/bin/bash"]' >> Dockerfile

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ matrix.output_image }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=latest

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/docker-build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  generate_dbt_setup_release_env:
    name: generate_dbt_setup_release_env
    runs-on: ubuntu-latest
    needs: update_image
    container:
      image: ghcr.io/dune-daq/stable-release-alma9:fddaq-${{ github.event.inputs.fddaq-release }}-a9
    defaults:
      run:
        shell: bash

    steps:
    
    - name: create dbt-setup-release-env.sh and daq_app_rte.sh for fddaq release
      run: |
          source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
          setup_dbt latest_v5

          dbt-setup-release fddaq-${{ github.event.inputs.fddaq-release }}-a9
          declare -x > ${GITHUB_WORKSPACE}/fddaq-dbt-setup-release-env.sh
          declare -f >> ${GITHUB_WORKSPACE}/fddaq-dbt-setup-release-env.sh
          egrep "declare -x (PATH|.*_SHARE|CET_PLUGIN_PATH|DUNEDAQ_SHARE_PATH|LD_LIBRARY_PATH|LIBRARY_PATH|PYTHONPATH)=" ${GITHUB_WORKSPACE}/fddaq-dbt-setup-release-env.sh > ${GITHUB_WORKSPACE}/fddaq_app_rte.sh


    - name: upload fddaq-dbt-setup-release-env.sh
      uses: actions/upload-artifact@v7
      with:
        name: fddaq-dbt_setup_release_env
        path: ${{ github.workspace }}/fddaq-dbt-setup-release-env.sh

    - name: upload fddaq_app_rte.sh
      uses: actions/upload-artifact@v7
      with:
        name: fddaq_app_rte
        path: ${{ github.workspace }}/fddaq_app_rte.sh
