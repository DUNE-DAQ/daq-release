name: Slack Notification

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
        description: Name of the release used in the caller workflow.
      # Used to disambiguate which workflow called this one when
      # multiple workflows are nested. The default is the 
      # top-level workflow.
      caller:
        type: string
        description: 'Identifier of the caller workflow.'
        default: ${{ github.workflow }}
      integtest_log_dir:
        type: string
        default: ''
        description: Optional path to directory containing the full pytest output.
      artifact_name:
        type: string
        default: ''
        description: Optional artifact name to download for additional metadata.
    secrets:
      slack_webhook_url:
        required: true

jobs:
  generate_and_send_slack_message:
    runs-on: daq
    steps:
    - name: Checkout daq-release
      uses: actions/checkout@v4
      with:
        repository: DUNE-DAQ/daq-release
        path: daq-release-slack-message
    - name: Get workflow summary from GitHub API
      run: |
        # Outputs workflow_summary.json
        ./daq-release-slack-message/scripts/github-ci/get_workflow_summary.sh ${{ github.run_id }}
    - name: Download artifact if specified
      if: ${{ inputs.artifact_name }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact_name }}
    - name: Add metadata to workflow summary
      run: |
        ARTIFACT_JSON="{}"
        if [[ -f "${{ inputs.artifact_name}}" ]]; then
          ARTIFACT_JSON="$(cat "${{ inputs.artifact_name }}")"
          echo "Found additional artifact data:"
          echo "$ARTIFACT_JSON"
        else
          echo "ERROR: Artifact ${{ inputs.artifact_name }} not found. Exiting..."
          exit 123
        fi

        jq --null-input \
           --arg release "${{ inputs.release_tag }}" \
           --arg caller  "${{ inputs.caller }}" \
           --arg pytest_log_dir "${{ inputs.integtest_log_dir }}" \
           --argjson artifact_data "$ARTIFACT_JSON" \
           '{
              "release"        : $release,
              "caller"         : $caller,
              "pytest_log_dir" : $pytest_log_dir,
              "artifact_data"  : $artifact_data
            }' > additional_metadata.json

        jq -s '.[0] + .[1]' workflow_summary.json additional_metadata.json > workflow_summary_with_metadata.json
        cat workflow_summary_with_metadata.json
    - name: Parse GitHub API output
      run: |
        python daq-release-slack-message/scripts/github-ci/slack_message_builder.py \
               --workflow-summary workflow_summary_with_metadata.json
        cat slack_payload.json
    - name: Send Slack Message
      uses: slackapi/slack-github-action@v2.1.1
      with:
        webhook: ${{ secrets.slack_webhook_url }}
        webhook-type: incoming-webhook
        payload-file-path: "./slack_payload.json"
        payload-templated: true
        errors: true
    - name: Cleanup files
      run: |
        rm workflow_summary.json additional_metadata.json workflow_summary_with_metadata.json slack_payload.json || true
        rm -rf daq-release-slack-message