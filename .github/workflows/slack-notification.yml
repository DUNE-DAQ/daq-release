name: Slack Notification

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
        description: Name of the release used in the caller workflow.
      #integtest_xml_dir:
      #  type: string
      #  default: ''
      #  description: Optional path to directory containing junit xml files output by pytests.
      integtest_log_dir:
        type: string
        default: ''
        description: Optional path to directory containing the full pytest output.
    secrets:
      slack_webhook_url:
        required: true

jobs:
  generate_and_send_slack_message:
    runs-on: daq
    steps:
    - name: Checkout daq-release
      uses: actions/checkout@v4
      with:
        repository: DUNE-DAQ/daq-release
        path: daq-release-slack-message
    - name: Get workflow failures from GitHub API
      run: |
        # Outputs workflow_summary.json
        ./daq-release-slack-message/scripts/github-ci/get_workflow_summary.sh ${{ github.run_id }}
    - name: Add metadata to workflow summary
      if: ${{ inputs.integtest_log_dir }}
      run: |
        jq --null-input \
           --arg pytest_log_dir "${{ inputs.integtest_log_dir }}" \
           --arg release "${{ inputs.release_tag }}" \
           '{"pytest_log_dir": $pytest_log_dir,
             "release"       : $release}' > additional_metadata.json
        jq -s '.[0] + .[1]' workflow_summary.json additional_metadata.json > workflow_summary_with_metadata.json
    - name: Parse GitHub API output
      run: |
        python daq-release-slack-message/scripts/github-ci/slack_message_builder.py \
               --workflow-summary workflow_summary_with_metadata.json
        cat slack_payload.json
    - name: Send Slack Message
      uses: slackapi/slack-github-action@v2.1.1
      with:
        webhook: ${{ secrets.slack_webhook_url }}
        webhook-type: incoming-webhook
        payload-file-path: "./slack_payload.json"
        payload-templated: true
        errors: true
    - name: Cleanup files
      run: |
        rm failed_jobs.json slack_payload.json
        rm -rf daq-release-slack-message