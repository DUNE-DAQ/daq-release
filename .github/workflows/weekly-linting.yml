name: Weekly linting workflow

on:
  workflow_dispatch:
    inputs:
      send-slack-message:
        description: 'whether to send a message to #daq-release-notifications on completion'
        default: 'no'
  schedule:
    - cron: "0 12 * * 0"

jobs:
  make_nightly_tag:
    name: create nightly tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create_nightly_tag.outputs.nightly_tag }} 
    defaults:
      run:
        shell: bash
    steps:
      - id: create_nightly_tag
        run: |
          date_tag=$(date +%y%m%d)
          echo "nightly_tag=NFD_DEV_${date_tag}_A9"  >>  "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  run_linting:
    name: Run linting
    runs-on: daq
    needs: make_nightly_tag
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout daq-release
      uses: actions/checkout@v4
      with:
        path: daq-release-linting
    - name: Create build area and run linting
      run: |
        tmpdirname=$( mktemp -d )
        cd ./daq-release-linting/scripts
        ./checkout-daq-package.py -i ../configs/coredaq/coredaq-develop/release.yaml -a -o $tmpdirname
        ./checkout-daq-package.py -i ../configs/fddaq/fddaq-develop/release.yaml -a -o $tmpdirname
        cd ../..

        source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
        setup_dbt latest_v5
        dbt-create -n ${{ needs.make_nightly_tag.outputs.tag }}
        cd ${{ needs.make_nightly_tag.outputs.tag }}
        source env.sh

        for repodir in $( find $tmpdirname -mindepth 1 -maxdepth 1 ); do
          mv $repodir $DBT_AREA_ROOT/sourcecode
          dbt-workarea-env
          dbt-build --clean --lint
          cd $DBT_AREA_ROOT/sourcecode
          repo=$( echo $repodir | tr "/" "\n" | tail -1 )
          rm -rf $repo
          cd ..
        done

        rmdir $tmpdirname
        tar czf linting_results.tgz log/linting*

    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: Linting results
        path: ${{ needs.make_nightly_tag.outputs.tag }}/linting_results.tgz

  send_slack_message:
    if: (github.event_name != 'workflow_dispatch' && failure()) || (github.event_name == 'workflow_dispatch' && github.event.inputs.send-slack-message == 'yes')
    needs: run_linting
    uses: ./.github/workflows/slack-notification.yml
    secrets: 
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  cleanup_test_area:
    runs-on: daq
    if: always()
    needs: [make_nightly_tag, run_linting]
    steps:
      - name: Remove test directory
        run: |
          rm -rf daq-release-linting
          rm -rf ${{ needs.make_nightly_tag.outputs.tag }}