name: Safe-Mode Alma10 Spack Troubleshooting

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  troubleshoot_spack:
    name: troubleshoot_spack
    runs-on: daq
    container:
      image: almalinux:10
    defaults:
      run:
        shell: bash

    steps:
    - name: basic_check
      run: |
        dnf -y install wget git gzip bzip2 gcc gcc-c++ make patch python3-pip
        export SPACK_EXTERNALS=/cvmfs/dunedaq.opensciencegrid.org/spack/externals/ext-v2.3
        mkdir -p $SPACK_EXTERNALS
        cd $SPACK_EXTERNALS
        wget https://github.com/spack/spack/archive/refs/tags/v0.22.0.tar.gz
        tar xf v0.22.0.tar.gz
        ls -l /cvmfs/dunedaq.opensciencegrid.org/spack/externals/ext-v2.3/spack-0.22.0/share/spack/setup-env.sh
        source /cvmfs/dunedaq.opensciencegrid.org/spack/externals/ext-v2.3/spack-0.22.0/share/spack/setup-env.sh
        spack compiler find
        spack compilers
        spack -dv --stacktrace spec graphviz
        echo "JCF: done"
