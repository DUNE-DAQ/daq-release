name: Run Unit Tests on a Given Release

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
        description: Name of the release to unit test. If not provided, use the latest nightly area on daq.fnal.gov.
      upload_logs:
        type: string
        required: false
        default: 'no'
        description: Whether to upload unit test summary logs.
      send-slack-message:
          description: 'whether to send a message to #daq-release-notifications on completion'
          type: string
          default: 'no'
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        default: ''
        description: Name of the release to unit test. If not provided, use the latest nightly area on daq.fnal.gov.
      upload_logs:
        required: false
        default: 'yes'
        description: Whether to upload unit test summary logs.
      send-slack-message:
          description: 'whether to send a message to #daq-release-notifications on completion'
          type: string
          default: 'no'

env:
  DAQ_RELEASE_PATH: nightly-daq-release

jobs:
  run_unittests:
    name: Run unit tests
    runs-on: daq
    timeout-minutes: 30
    outputs:
      used_tag: ${{ steps.unit_tests.outputs.used_tag }}
    env:
      INPUT_TAG: ${{ inputs.release_tag || 'latest_nightly' }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
      with:
        path: ${{ env.DAQ_RELEASE_PATH }}
    - name: Create release area
      if: ${{ env.INPUT_TAG != 'latest_nightly' }}
      id: release_area
      uses: ./nightly-daq-release/.github/actions/create-build-area
      with:
        tag: ${{ env.INPUT_TAG }}
    - name: Run unit tests
      id: unit_tests
      run: |
        if [[ ! -d "$INPUT_TAG" ]]; then
          echo "ERROR: No release area named $INPUT_TAG found on daq.fnal.gov"
          exit 1
        fi
        cd $INPUT_TAG
        source env.sh

        used_tag=$(dbt-info release | grep "Release name" | awk '{print $3}')
        echo "used_tag=$used_tag" >> "$GITHUB_OUTPUT"
        echo "Unit testing release $used_tag"

        spack load dbe
        dbt-workarea-env
        dbt-build --unittest

        log_summary_file=$(realpath $(find log/ -name unit_test_summary.log | tail -n 1))
        if [[ ! -f "$log_summary_file" ]]; then
          echo "ERROR: No file named unit_test_summary.log found in $(readlink -f log/)"
        fi
        echo "Log summary file: $log_summary_file"
        echo "Contents of DBT_AREA_ROOT/log: $(ls $DBT_AREA_ROOT/log)"
        ../${{ env.DAQ_RELEASE_PATH }}/scripts/github-ci/parse_unit_test_summary.sh $log_summary_file | tee $GITHUB_STEP_SUMMARY
        echo "unit_test_summary=$log_summary_file" >> "$GITHUB_OUTPUT"
    - name: Upload summary log
      # Handle both workflow_call and workflow_dispatch cases
      if: ${{ inputs.upload_logs == 'yes' || github.event.inputs.upload_logs == 'yes' }}
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: unit_test_summary
        path: ${{ steps.unit_tests.outputs.unit_test_summary }}

  send_slack_message:
    if: (success() || failure()) && (inputs.send-slack-message == 'yes' && github.event_name == 'workflow_dispatch')
    needs: [run_unittests]
    uses: ./.github/workflows/slack-notification.yml
    with:
      release_tag: ${{ needs.run_unittests.outputs.used_tag }}
    secrets: 
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  cleanup_files:
    if: always()
    needs: run_unittests
    runs-on: daq
    env:
      INPUT_TAG: ${{ inputs.release_tag }}
    steps:
    - name: Remove files
      run: |
        if [[ -n "$INPUT_TAG" && -d "$INPUT_TAG" ]]; then
          echo "Removing $INPUT_TAG directory now that testing is complete."
          rm -rf -- "$INPUT_TAG"
        fi
        if [[ -n "$DAQ_RELEASE_PATH" && -d "$DAQ_RELEASE_PATH" ]]; then
          echo "Removing $DAQ_RELEASE_PATH directory now that testing is complete."
          rm -rf -- "$DAQ_RELEASE_PATH"
        fi
