name: Nightly build and tests

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      tag-prefix:
        description: 'nightly tag prefix (also used for output container tag)'
        default: ''
      feature-branch:
        description: 'feature branch to be used across all DAQ repos wherever possible.'
        default: develop
      cvmfs-deployment:
        description: 'whether to deploy the release to cvmfs'
        default: 'no'
      send-slack-message:
        description: 'whether to send a message to #daq-release-notifications on completion'
        default: 'no'

jobs:
  build:
    uses: ./.github/workflows/build-nightly-release-alma9.yml
    with:
      tag-prefix: ${{ inputs.tag-prefix }}
      feature-branch: ${{ inputs.feature-branch }}
      cvmfs-deployment: ${{ inputs.cvmfs-deployment }}
      send-slack-message: ${{ inputs.send-slack-message }}
    secrets:
      slack_webhook_url: ${{ secrets.slack_webhook_url }}

  wait_for_cvmfs_publication:
    needs: build
    runs-on: daq
    timeout-minutes: 90
    continue-on-error: true
    steps:
    - name: Check for release on CVMFS
      run: |
        ~/wait_for_cvmfs_publication.sh \
          --check-for "T3FD_*" \

  run_build_tests:
    needs: wait_for_cvmfs_publication
    uses: ./.github/workflows/nightly-code-check.yml
    with:
      send-slack-message: 'yes'
    secrets: 
      slack_webhook_url: ${{ secrets.SLACK_TEST_WEBHOOK }}

