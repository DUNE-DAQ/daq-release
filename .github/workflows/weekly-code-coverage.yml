name: Weekly code coverage workflow

on:
  workflow_dispatch:
    inputs:
      send-slack-message:
        description: 'whether to send a message to #daq-release-notifications on completion'
        default: 'no'
  schedule:
    - cron: "0 19 * * 0"

jobs:
  make_nightly_tag:
    name: create nightly tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create_nightly_tag.outputs.nightly_tag }} 
    defaults:
      run:
        shell: bash
    steps:
      - id: create_nightly_tag
        run: |
          date_tag=$(date +%y%m%d)
          echo "nightly_tag=NFD_DEV_${date_tag}_A9"  >>  "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  generate_code_coverage_report:
    name: Generate code coverage report
    runs-on: daq
    needs: make_nightly_tag
    timeout-minutes: 120
    env:
      TAG: ${{ needs.make_nightly_tag.outputs.tag }}
      RESULTS_DIR: ${{ needs.make_nightly_tag.outputs.tag }}/code_coverage_results/html
    outputs:
      coverage_results_dir: ${{ steps.create_build_area.outputs.results_dir }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout daq-release
      uses: actions/checkout@v6
      with:
        path: daq-release-lcov
    - name: Create build area
      id: create_build_area
      run: |
        echo "results_dir=$RESULTS_DIR" >> "$GITHUB_OUTPUT"
        source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
        setup_dbt latest_v5
        dbt-create -n $TAG
        cd $TAG
        source env.sh
        cd ../daq-release-lcov/scripts
        ./checkout-daq-package.py -i ../configs/coredaq/fddaq-develop/release.yaml -a -o ${DBT_AREA_ROOT}/sourcecode
        ./checkout-daq-package.py -i ../configs/fddaq/fddaq-develop/release.yaml -a -o ${DBT_AREA_ROOT}/sourcecode
        #./checkout-daq-package.py -p hdf5libs -b develop -i ../configs/coredaq/fddaq-develop/release.yaml -o ${DBT_AREA_ROOT}/sourcecode
        #./checkout-daq-package.py -p flxlibs -b develop -i ../configs/fddaq/fddaq-develop/release.yaml -o ${DBT_AREA_ROOT}/sourcecode
        echo "DBT_AREA_ROOT=${DBT_AREA_ROOT}" >> "$GITHUB_ENV"
    - name: Run dbt-lcov.sh
      id: run_lcov
      run: |
        cd $DBT_AREA_ROOT/
        source env.sh
        dbt-workarea-env
        # spack load dbe
        dbt-lcov.sh
    - name: Create fallback html
      if: failure()
      run: |
        if [[ ! -f "$RESULTS_DIR/index.html" ]]; then
          mkdir -p "$RESULTS_DIR"
          {
            echo "It appears there was a problem with the code coverage workflow."
            echo "Contact Software Coordination."
          } > "$RESULTS_DIR/index.html"
        fi
    - name: Upload html output as artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: code_coverage
        path: ${{ env.RESULTS_DIR }}

  send_slack_message:
    if: (github.event_name != 'workflow_dispatch') || (github.event_name == 'workflow_dispatch' && github.event.inputs.send-slack-message == 'yes')
    needs: [make_nightly_tag, generate_code_coverage_report]
    uses: ./.github/workflows/slack-notification.yml
    with:
      release_tag: ${{ needs.make_nightly_tag.outputs.tag }}
    secrets: 
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  cleanup_test_area:
    runs-on: daq
    if: always()
    needs: [make_nightly_tag, generate_code_coverage_report]
    steps:
      - name: Remove test directory
        run: |
          rm -rf daq-release-lcov
          rm -rf ${{ needs.make_nightly_tag.outputs.tag }}