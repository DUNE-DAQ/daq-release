name: Nightly CI Dashboard Publication

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      feature_branch:
        description: >-
          Optional branch from which to pull nightly artifacts.
          Falls back to develop if no workflow runs from that branch are available.
        type: string
        default: 'develop'
      send-slack-message:
        description: 'whether to send a message to #daq-release-notifications on completion'
        default: 'no'
  schedule:
    - cron: "0 10 * * *"

jobs:
  build_site:
    name: Build CI site and upload
    runs-on: ubuntu-latest
    defaults:
      run: 
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_DASHBOARD_DIR: scripts/github-ci/ci-dashboard
      BRANCH: ${{ inputs.feature_branch || 'develop' }}
    steps:
    - uses: actions/checkout@v6
    - name: Set paths to artifacts
      id: set_paths
      run : |
        echo "lcov_html_report_path=lcov_report" >> "$GITHUB_OUTPUT"
        echo "integration_test_summary_path=integration_test_summary" >> "$GITHUB_OUTPUT"
        echo "extended_integration_test_summary_path=extended_integration_test_summary" >> "$GITHUB_OUTPUT"

    - name: Download artifacts
      id: download
      run: |
        gh run download -n code_coverage -D ${{ steps.set_paths.outputs.lcov_html_report_path }}
        gh run download -n nightly_integtest_json -D ${{ steps.set_paths.outputs.integration_test_summary_path }}
        gh run download -n nightly_extended_integtest_json -D ${{ steps.set_paths.outputs.extended_integration_test_summary_path }}
  
    - name: Copy artifacts and generate dashboard
      run: |
        cp -r lcov_report ${{ env.CI_DASHBOARD_DIR }}/site/code_coverage
        cp -r integration_test_summary/ ${{ env.CI_DASHBOARD_DIR }}/integration_test_summary
        cp -r extended_integration_test_summary/ ${{ env.CI_DASHBOARD_DIR }}/extended_integration_test_summary
        cd ${{ env.CI_DASHBOARD_DIR }}
        ./collect-ci-metrics.sh
        echo "ls -lrt:"
        ls -lrt
        echo "Collected the following metrics:"
        cat ci_summary.json
        python generate_ci_site.py --json_input ci_summary.json \
                                   --artifacts_dir artifacts \
                                   --core_pytest_summary integration_test_summary/pytest_summary.json \
                                   --extended_pytest_summary extended_integration_test_summary/pytest_summary.json \

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v5
      env:
        CI_DASHBOARD_DIR: scripts/github-ci/ci-dashboard
      with:
        path: ${{ env.CI_DASHBOARD_DIR }}/site

  deploy_to_github_pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build_site
    permissions:
        contents: read
        pages: write
        id-token: write
    environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Configure GitHub Pages
      uses: actions/configure-pages@v6
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5


