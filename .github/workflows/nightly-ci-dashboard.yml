name: Nightly CI Dashboard Publication

on:
  workflow_dispatch:
    inputs:
      send-slack-message:
        description: 'whether to send a message to #daq-release-notifications on completion'
        default: 'no'
  schedule:
    - cron: "0 11 * * *"

jobs:
  download_artifacts:
    name: Download artifacts
    runs-on: daq
    outputs:
      lcov_html_report_path: ${{ steps.set_paths.outputs.lcov_html_report_path }}
      code_check_summary_path: ${{ steps.set_paths.outputs.code_check_summary_path }}
      integration_test_summary_path: ${{ steps.set_paths.outputs.integration_test_summary_path }}
    defaults:
      run: 
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Set paths to artifacts
      id: set_paths
      run : |
        echo "lcov_html_report_path=lcov_report" >> "$GITHUB_OUTPUT"
        echo "code_check_summary_path=code_check_summary" >> "$GITHUB_OUTPUT"
        echo "integration_test_summary_path=integration_test_summary" >> "$GITHUB_OUTPUT"
    - name: Get workflow run IDs
      id: run_ids
      run: |
        lcov_id=$(gh run list --repo DUNE-DAQ/daq-release \
                              --workflow "Weekly code coverage workflow" \
                              --limit 1 --status success \
                              --json databaseId --jq '.[0].databaseId')
        code_check_id=$(gh run list --repo DUNE-DAQ/daq-release \
                                   --workflow nightly-code-check.yml \
                                   --limit 1 --status success \
                                   --json databaseId --jq '.[0].databaseId')
        integration_test_id=$(gh run list --repo DUNE-DAQ/daq-release \
                                          --workflow integration_tests.yml \
                                          --limit 1 --status success \
                                          --json databaseId --jq '.[0].databaseId')
        echo "code_check_id=$code_check_id" | tee -a "$GITHUB_OUTPUT"
        echo "lcov_id=$lcov_id" | tee -a "$GITHUB_OUTPUT"
        echo "integration_test_id=$integration_test_id" | tee -a "$GITHUB_OUTPUT"

    - name: Download lcov html report
      id: download_lcov
      uses: actions/download-artifact@v6
      with:
        name: code_coverage
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ steps.set_paths.outputs.lcov_html_report_path }}
        run-id: ${{ steps.run_ids.outputs.lcov_id }}
        
    - name: Download code check summaries
      id: download_code_checks
      uses: actions/download-artifact@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ steps.set_paths.outputs.code_check_summary_path }}
        run-id: ${{ steps.run_ids.outputs.code_check_id }}

    - name: Download integration test summary
      id: download_integration_test
      uses: actions/download-artifact@v6
      with:
        name: nightly_integtest_summary
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ steps.set_paths.outputs.integration_test_summary_path }}
        run-id: ${{ steps.run_ids.outputs.integration_test_id }}
  
  build_ci_dashboard:
    runs-on: daq
    needs: download_artifacts
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout daq-release feature branch
      uses: actions/checkout@v4
      with:
        path: daq-release-ci-dashboard
    - name: Copy artifacts and generate dashboard
      run: |
        mkdir -p daq-release-ci-dashboard/scripts/github-ci/site
        cp -r lcov_report daq-release-ci-dashboard/scripts/github-ci/site/code_coverage
        cp -r code_check_summary/ daq-release-ci-dashboard/scripts/github-ci/code_check_summary
        cp -r integration_test_summary/ daq-release-ci-dashboard/scripts/github-ci/integration_test_summary
        cd daq-release-ci-dashboard/scripts/github-ci/
        ./collect-ci-metrics.sh
        ./combine_markdown_summaries.sh integration_test_summary/pytest_summary_table.md \
                                        code_check_summary/pytest_summary_table.md \
                                        > combined_pytest_summary.md
        cat combined_pytest_summary.md
        python generate_ci_site.py --json_input ci_summary.json \
                                   --unit_test_summary code_check_summary/unit_test_summary/unit_test_summary.log \
                                   --pytest_summary combined_pytest_summary.md

  deploy_to_github_pages:
    name: Deploy to GitHub Pages
    runs-on: daq
    needs: build_ci_dashboard
    permissions:
        contents: read
        pages: write
        id-token: write
    environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5
    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ${{ github.workspace }}/daq-release-ci-dashboard/scripts/github-ci/site
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  cleanup_test_area:
    runs-on: daq
    if: always()
    needs: [deploy_to_github_pages]
    steps:
    - name: Remove test directory
      run: |
        rm -rf daq-release-ci-dashboard/

