name: Nightly CI Dashboard Publication

on:
  workflow_dispatch:
    inputs:
      send-slack-message:
        description: 'whether to send a message to #daq-release-notifications on completion'
        default: 'no'

jobs:
  download_artifacts:
    name: Download artifacts
    runs-on: daq
    outputs:
      lcov_html_report_path: ${{ steps.set_paths.outputs.lcov_html_report_path }}
      unit_test_summary_path: ${{ steps.set_paths.outputs.unit_test_summary_path }}
    defaults:
      run: 
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Set paths to artifacts
      id: set_paths
      run : |
        echo "lcov_html_report_path=lcov_report" >> "$GITHUB_OUTPUT"
        echo "unit_test_summary_path=unit_test_summary" >> "$GITHUB_OUTPUT"
    - name: Get workflow run IDs
      id: run_ids
      run: |
        lcov_id=$(gh run list --repo DUNE-DAQ/daq-release \
                              --workflow "Weekly code coverage workflow" \
                              --limit 1 \
                              --json databaseId --jq '.[0].databaseId')
        unit_test_id=$(gh run list --repo DUNE-DAQ/daq-release \
                                   --workflow "Run Unit Tests on a Given Release" \
                                   --limit 1 \
                                   --json databaseId --jq '.[0].databaseId' \
                                   --branch amogan/ci_dashboard)
        echo "Most recent unit test workflow ID: $unit_test_id"
        echo "Most recent coverage workflow ID: $lcov_id"
        echo "unit_test_id=$unit_test_id" >> "$GITHUB_OUTPUT"
        echo "lcov_id=$lcov_id" >> "$GITHUB_OUTPUT"
    - name: Download lcov html report
      id: download_lcov
      uses: actions/download-artifact@v4
      with:
        name: code_coverage_html
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ steps.set_paths.outputs.lcov_html_report_path }}
        run-id: ${{ steps.run_ids.outputs.lcov_id }}
    - name: Download unit test summary
      id: download_unit_test
      uses: actions/download-artifact@v4
      with:
        name: unit_test_summary
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ steps.set_paths.outputs.unit_test_summary_path }}
        run-id: ${{ steps.run_ids.outputs.unit_test_id }}
  
  check_artifacts:
    name: Check artifacts
    needs: download_artifacts
    runs-on: daq
    defaults:
      run:
        shell: bash
    steps:
    - name: Check artifacts
      run: |
        echo "pwd: $(pwd)"
        echo "ls: $(ls)"
        ls ${{ needs.download_artifacts.outputs.unit_test_summary_path }}/unit_test_summary.log

  build_ci_dashboard:
    runs-on: daq
    needs: download_artifacts
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout daq-release feature branch
      uses: actions/checkout@v4
      with:
        ref: amogan/ci_dashboard
        path: daq-release-ci-dashboard
    - name: Copy lcov report into dashboard
      run: |
        mkdir -p daq-release-ci-dashboard/scripts/github-ci/site
        cp -r lcov_report daq-release-ci-dashboard/scripts/github-ci/site
        cd daq-release-ci-dashboard/scripts/github-ci/
        ./collect-ci-metrics.sh
        echo "Summary file? $(ls ${{ github.workspace }}/${{ needs.download_artifacts.outputs.unit_test_summary_path }}/unit_test_summary.log)"
        python generate_ci_site.py --json_input ci_summary.json --unit_test_summary ${{ github.workspace }}/${{ needs.download_artifacts.outputs.unit_test_summary_path }}/unit_test_summary.log

  deploy_to_github_pages:
    name: Deploy to GitHub Pages
    runs-on: daq
    needs: build_ci_dashboard
    permissions:
        contents: read
        pages: write
        id-token: write
    environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5
    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ github.workspace }}/daq-release-ci-dashboard/scripts/github-ci/site
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  cleanup_test_area:
    runs-on: daq
    if: always()
    needs: [deploy_to_github_pages]
    steps:
    - name: Remove test directory
      run: |
        echo "NOT REMOVING YET, will be done once everything works"
        ls daq-release-ci-dashboard/scripts/github-ci/site

